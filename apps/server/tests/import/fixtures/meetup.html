mber/"},"Member:313786528":{"__typename":"Member","id":"313786528","name":"Abbas Kabir","memberPhoto":{"__ref":"PhotoInfo:315688190"}},"Event:317306105":{"__typename":"Event","id":"317306105","title":"Boston Holiday Lights Walk","dateTime":"2026-12-09T17:30:00-05:00","description":"Join [Sober \u0026 Curious Boston](https://www.sobercuriousboston.com) for a festive evening exploring Boston’s holiday lights! We’ll stroll approximately 3 miles through Boston Common and the Public Garden before heading down the Commonwealth Avenue Mall to enjoy its glowing canopy of trees.\n\n**Event Details**\nWednesday, December 9, 2026\n5:30–7:30 PM\nBoston Common\nMeeting point: Outside the Boston Common Visitor Information Center, 139 Tremont Street, Boston\nQuestions? Email info@sobercuriousboston.com.\n\n**About SCB**\n[Sober \u0026 Curious Boston](https://www.sobercuriousboston.com) is a 501(c)(3) nonprofit building community through connection and experiences that don’t revolve around alcohol. Whether you’re sober, sober curious, drinking less, taking a break, supporting someone, or simply looking to meet new people, everyone is welcome. We host events throughout Boston, Greater Boston, the South Shore, and Cape Cod.\n\n**Event Guidelines**\nOur events are designed to be welcoming and alcohol-free. While some events take place at venues where alcohol is available or consumed by the general public, we ask attendees not to consume alcohol or attend under the influence of alcohol or other substances. Thank you for helping us create an environment where everyone can feel comfortable participating.\n\n**Photo \u0026 Video Policy**\nWe love sharing the energy and connection that make our community special. Photos and videos may be taken at Sober \u0026 Curious Boston events and used on our website, social media, newsletters, promotional materials, and other communications. From time to time, we may also share select photos or videos with trusted partners, sponsors, or media outlets f the local arts calendar.\n\nWhether you're a resident or affiliate artist, this is your opportunity to share your work, connect with the community, and be part of one of Somerville’s most beloved art events.\n\n**Getting there:**\n\n**Train**: We are located right off the East Somerville Green Line T-Stop\n**Bus**: There are several bus lines that drop off right outside our neighborhood. We recommend look local bus routes on your favorite transit app.\n**Parking**: There will be free parking in the parking structure beneath 100 Chestnut Street. There is limited street parking available as well.\n\n**\\#\\#\\# Help Us Keep This Going \\#\\#\\#**\nIf you’d like to support the community:\n\n* **Donate via DonorBox:** [https://donorbox.org/random-acts-of-connection-2026](https://donorbox.org/random-acts-of-connection-2026)\n* **Support us by buying merch:** [https://randomactsofconnection.dashery.com/](https://randomactsofconnection.dashery.com/)\n\nSupport is always optional. Showing up already matters.\n**\\#\\#\\# FAQ \\#\\#\\#**\n**1\\. What is the age range?**\nWe don’t police connection by age, but plenty of other groups do if that’s what you’re looking for\n2. **Where do people meet?**\nThe exact meeting spot is shared in the Discussion section of the event once the hosts arrive at the location, unless otherwise specified. Please check there the day of the event.\n3. **I'm arriving late. How do I find the group?**\nIf you arrive late, please note that hosts are not responsible for helping attendees locate the group once the event has started. Hosts are focused on welcoming and facilitating those who arrived on time and may not be able to respond to messages.\nAny location updates will be posted in the event’s comment section. We strongly encourage arriving on time to ensure you can find the group and participate fully.\n4. **What about parking?**\nParking is your responsibility. We don’t manage or guarantee parking options for attendees. Check apps like SpotHero, ParkWhiz or BestParking.","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/boston-random-acts-of-connection/events/317248560/","isAttending":false,"isSaved":false,"maxTickets":0,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536935791"},"displayPhoto":{"__ref":"PhotoInfo:536935791"},"feeSettings":null,"group":{"__ref":"Group:37727473"},"socialProofInsights":null,"rsvps":{"__typename":"RsvpConnection","totalCount":53,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:9303295"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:24720352"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:479531005"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:475553588"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:58253322"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:45671242"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:482911148"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:191248527"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:480281411"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:5556139"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:423184496"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:418463777"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:480786086"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:3263337"}}},{"__typename":"RsvpEdge","node":{"__type s_260431897.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:213617916":{"__typename":"Member","id":"213617916","name":"Leo","memberPhoto":{"__ref":"PhotoInfo:260431897"}},"Member:482570399":{"__typename":"Member","id":"482570399","name":"logan.t.piper","memberPhoto":null},"PhotoInfo:324839503":{"__typename":"PhotoInfo","id":"324839503","highResUrl":"https://secure.meetupstatic.com/photos/member/e/8/6/f/highres_324839503.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:11749786":{"__typename":"Member","id":"11749786","name":"Brian Hanrahan","memberPhoto":{"__ref":"PhotoInfo:324839503"}},"PhotoInfo:232788952":{"__typename":"PhotoInfo","id":"232788952","highResUrl":"https://secure.meetupstatic.com/photos/member/b/f/3/8/highres_232788952.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:2966928":{"__typename":"Member","id":"2966928","name":"Mark Fisher","memberPhoto":{"__ref":"PhotoInfo:232788952"}},"PhotoInfo:12019548":{"__typename":"PhotoInfo","id":"12019548","highResUrl":"https://secure.meetupstatic.com/photos/member/4/c/5/c/highres_12019548.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:13992883":{"__typename":"Member","id":"13992883","name":"eran shaysh","memberPhoto":{"__ref":"PhotoInfo:12019548"}},"Member:482873709":{"__typename":"Member","id":"482873709","name":"Edward Minn","memberPhoto":null},"Event:317304495":{"__typename":"Event","id":"317304495","title":"Boston Generative AI Meetup: AI Agents, Data \u0026 the Power of Context","dateTime":"2026-11-30T18:00:00-05:00","description":"***Boston Generative AI Meetup: AI Agents, Data \u0026 the Power of Context***\n\n***Monday, November 30, 2026***\n***High Street Place Food Hall***\n***100 High Street***\n***Boston, Massachusetts 02110***\n\nJoin the Boston Generative AI Meetup for an evening exploring what it takes to build AI agents that can understand context, access the right information, remember what matters, and take useful action.\n\nAI agents are expanding what we expect software to do. As applications begin working across data, tools, and business processes, they raise practical questions about what they should know, what they should remember, and what they should be allowed to do.\n\nHow do we connect agents to the information they need? How do we keep that information accurate and current? How should agents retain context across interactions? When should a person review a decision? And where are these capabilities creating measurable value?\n\nWe’ll bring together founders, executives, developers, investors, researchers, students, and business leaders to examine these questions through a featured panel, a 30-minute technical talk from MongoDB’s Simone Gaiera, audience Q\u0026A, and networking at High Street Place Food Hall in downtown Boston.\n\nWhether you are building an AI product, introducing agents into your organization, investing in emerging companies, or trying to understand what comes next, join us for an evening of practical learning and conversation.\n\n**What We’ll Explore**\n\nOur conversation will connect the latest developments in AI with the data, architecture, and business decisions required to put them to work:\n\n* From assistants to agents: Where AI systems that use tools and execute tasks can create value, and how to identify worthwhile applications.\n* Context engineering: Giving agents the relevant information, instructions, and tools they need at each step of a task.\n* Access to enterprise data and systems: How APIs, Model Context Protocol (MCP), and access controls fit together when connecting agents to business applications.\n* Agent memory and state: Tracking work in progress and deciding what agents should retain, retrieve, update, or forget across interactions.\n* Beyond basic retrieval: How retrieval-augmented generation (RAG), vector search, and hybrid search fit into applications that need both relevant knowledge and current operational data.\n* Trust, permissions, and accountability: Managing data validity, tracing agent actions, protecting sensitive information, and involving people where judgment matters.\n* Moving into production: Evaluating reliability, cost, speed, and maintainability as AI applications become part of everyday operations.\n* Business value and new opportunities: What these developments mean for products, customer experiences, enterprise adoption, entrepreneurship, and investment.\n\n***Featured Panel: AI Agents, Data \u0026 the Power of Context***\n\nHow do these technical choices affect the products we build, the organizations we run, and the opportunities we pursue?\n\nOur featured panel will explore the practical implications of AI agents: where they can improve work, what makes them dependable, how organizations should approach adoption, and where new business opportunities are emerging.\n\nExpect a candid conversation about the lessons coming from implementation, the challenges that deserve more attention, and the decisions leaders and builders should be making now.\n\n***Featured panelists:***\n\n1. ***Paul Baier. Founder and CEO. GAI Insights and Founder Generative AI World.*** Visionary. Thinker. Executive. Operator\n1. ***Stefanie Chiras, SVP, Red Hat \u0026 The Open Accelerator.*** Leader***.*** Executive. Engineer. Strategist.\n1. Shira T. Center, Vice President for Innovation and Strategic Initiatives, Boston Globe Media. Insightful. Strategic. Innovative. Purpose-driven.\n\n***More guest panelists announcing soon.*** We’ll update this listing as speakers are confirmed.\n\n**What to Expect**\n\n***1. 6-~7pm: Networking at High Street Place Food Hall***\nConnect with entrepreneurs, engineers, researchers, investors, executives, students, and business leaders from across Boston’s AI community\n\n***2. ~7pm-7:05pm: Welcome and Boston AI Community Update***\nWe’ll open with updates from the Boston Generative AI Meetup and Boston AI Week, including opportunities to connect and get involved in the year ahead.\n\n***3. ~7:05pm-8:00pm: Featured Panel Discussion***\nFour panelists will examine AI agents, data access, context, and the path from emerging capabilities to useful products and business outcomes.\n\n***4. 8:00pm-~8:30pm MongoDB Technical Presentation***\nSimone Gaiera will deliver his 30-minute talk, Beyond RAG: Building the Context Layer for AI Agents with MongoDB, including the practical healthcare benefits example described above.\n\n***5. 8:30pm-9pm (End): Networking at High Street Place Food Hall***\nConnect with entrepreneurs, engineers, researchers, investors, executives, students, and business leaders from across Boston’s AI community.\n\n**6. Audience Q\u0026A Throughout**\nBring your questions, implementation challenges, and ideas. We’ll always have the audience lead with questions and ensure time for an interactive discussion that connects the evening’s themes to what members of the community are asking, building, and experiencing.\n\nCompare notes on a project, meet a potential collaborator, or continue a conversation sparked by the panel. Some of the most useful connections happen when people with different experiences gather in the same room.\n\n**Who Should Attend**\nThis event is for anyone interested in understanding, building, investing in, or applying AI, including:\n\n* Founders and entrepreneurs\n* CEOs and business executives\n* AI engineers and software developers\n* Technology, data, and security leaders\n* Product managers and designers\n* Data scientists and architects\n* Investors\n* Researchers and academics\n* Students\n* Business professionals exploring AI adoption\n* Anyone curious about AI agents and their impact on work and everyday life\n\nYou do not need to be an AI expert to participate. Whether you are deploying agents in production or just beginning to explore what they can do, you are welcome.\n\n**Special Guest Tech Talk: 30-minute technical presentation**\n\n***Beyond RAG: Building the Context Layer for AI Agents with MongoDB***\n\n**Simone Gaiera.** Senior Solutions Architect, MongoDB.\nSimone is a Senior Solutions Architect at MongoDB. His presentation will bring an architectural perspective to the evening’s central questions: how agents access information, maintain context, and support useful decisions.\n\nAs generative AI applications evolve from answering questions to making decisions, they introduce a new challenge: how do we manage what AI agents know, remember, and decide?\n\nIn this session, Simone will examine the architecture of a specialized context layer that complements traditional enterprise data warehouses and systems of record for AI workloads. He will cover the requirements for managing agent memory, retrieving relevant context, maintaining data validity, and governing AI-generated outcomes.\n\nUsing a practical healthcare benefits scenario, Simone will demonstrate how MongoDB’s flexible document model and retrieval capabilities can support context-aware AI applications. He will also discuss the architectural tradeoffs and where MongoDB may not be the right fit.\n\nAttendees will learn how to approach building more reliable, stateful AI agents that retain context across interactions and go beyond simple retrieval.\n\n***About MongoDB***\nMongoDB is a document database platform used to build modern applications. Its flexible data model and search capabilities support AI applications that combine operational data, relevant knowledge, and agent memory.\n\nFor this event, we’ll examine how those capabilities can contribute to the context layer behind AI agents, alongside the architectural choices that determine whether an approach fits a particular use case.\n\n***About the Boston Generative AI Meetup***\nThe Boston Generative AI Meetup brings together people who are building, applying, studying, investing in, and exploring artificial intelligence.\n\nOur events are built around substantive conversations, practical learning, and meaningful relationships. We connect technical ideas with business decisions and create space for people across disciplines, industries, and levels of experience to learn from one another.\n\nCome with questions. Share what you are learning. Meet people who are working through similar challenges.\n\n**Location: America’s #1 Food Hall as ranked by USA Today**\nHigh Street Place Food Hall\n100 High Street\nBoston, Massachusetts 02110\n\n***RSVP is required, and space is limited.***\n\nReserve your spot and join us on Monday, November 30, for an evening exploring AI Agents, Data \u0026 the Power of Context and the people, ideas, and technologies shaping how AI gets put to work.","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/boston-generative-ai-meetup/events/317304495/","isAttending":false,"isSaved":false,"maxTickets":320,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536995284"},"displayPhoto":{"__ref":"PhotoInfo:536995284"},"feeSettings":{"__typename":"EventFeeSettings","accepts":"PAYPAL","currency":"USD","amount":22},"group":{"__ref":"Group:36965286"},"socialProofInsights":null,"rsvps":{"__typename":"RsvpConnection","totalCount":65,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:154413742"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:4002686"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:484137656"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:469654479"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:7714502"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:485204572"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:468 iki/Epictetus,_the_Discourses_as_reported_by_Arrian,_the_Manual,_and_Fragments).\n\n\u003c\u003c\u003e\u003e\n\nThis time we will discuss Discourses 1.24, \"How to combat difficult circumstances,\" where Epictetus argues that our worth is revealed by how we handle difficulties. Time permitting, we will then go on to talk about Discourses 1.25, which happens to be on the same topic.\n\n\u003c\u003c\u003e\u003e\n\nPlease note that the **zoom link** will be shared with registered attendees on this page on the morning of the event, so make sure to check it before attempting to log in. Also, for security reasons (i.e., reducing the chances of \"zoom bombings\"), please **do not share the link** outside our group! Thanks!","eventType":"ONLINE","eventUrl":"https://www.meetup.com/global-stoa/events/317243358/","isAttending":false,"isSaved":false,"maxTickets":0,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536926920"},"displayPhoto":{"__ref":"PhotoInfo:536926920"},"feeSettings":null,"group":{"__ref":"Group:394905"},"socialProofInsights":null,"rsvps":{"__typename":"RsvpConnection","totalCount":190,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:3564443"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:160167592"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:3116207"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:402009280"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:265103294"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:325485170"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:337686348"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:9424642"}}},{"__typena roup":{"__typename":"Group","urlname":"loungeasiaamericas","__ref":"Group:38687177"},"title":"🍜Asian Background: Lounge Asia (Easy English) @Boston 6pm","description":"⚠️ IMPORTANT TIME ZONE NOTICE\n⏰ 6:00 PM–9:00 PM 📍 Boston local time\n\n🌏 Make new international friends in Boston. Come alone, practise your English, and enjoy a relaxed social night. 😊\nA friendly meetup for networking, language exchange, and real conversation — open to everyone.\n\n**Why People Love Lounge Asia**\n🍜 Asian-focused event\n🤝 Many guests come alone\n💬 No need for perfect English\n🌏 No games or forced introductions — just enjoy the conversation\nLounge Asia began within the Asian community, so people from Asia often feel comfortable and at home here. At the same time, everyone is welcome — locals, expats, travellers, students, returnees, digital nomads, and globally minded people.\n━━━━━━━━━━\n**How to Join**\n1️⃣ Tap \"RSVP\" on this page\n2️⃣ Show your Meetup QR code at reception\n3️⃣ Collect your name tag and start meeting people\n✅ Early RSVP is free\n✅ RSVPs made within 48 hours of the event start time are $5\n✅ Limited capacity — please RSVP early\nMany people attend alone, so don't worry if it's your first time.\n━━━━━━━━━━\n**How to Find Us**\n📍 **Venue**\nM.J. O’Connor’s Back Bay\n27 Columbus Ave, Boston, MA 02116, United States\n\n⏰ **Start Time — Boston Local Time**\nfrom 6:00 to 9:00 pm Boston time\n⚠️ Important: This is the local time in Boston. Meetup may display Brisbane time or another time zone, so please follow the local time shown above.\n\n🚶 **Getting There**\nLocated in Boston's Back Bay area near Copley Square.\n🚇 By public transport: Take the Green Line to Copley Station or the Orange Line to Back Bay Station, then walk to the venue.\n🚗 By car: Nearby paid parking garages and street parking are available.\nOur Lounge Asia organisers will be there to welcome you 😊\n━━━━━━━━━━\n🍺 **Please Support the Venue**\nThis event is free or low-cost because the venue supports our community. Please purchase at least one drink during the event. Your support helps us keep organising events at great venues.\n━━━━━━━━━━\n💚 **Please Be Respectful**\nLounge Asia is a friendly social event where everyone should feel comfortable and welcome.\n🚫 This is NOT a pickup or dating event. Anyone who makes others uncomfortable may be removed immediately.\nNot allowed: harassment, unwanted attention, MLM / crypto / religious recruitment, or anything that makes others uncomfortable.\nOrganisers reserve the right to refuse entry or ask anyone to leave.\n🪪 A valid government-issued photo ID is strictly required for entry. No photo ID, no entry. Driver's licences must be issued by the government of the country where the event is held.\n📸 Photos and short videos may be taken for community and promotional purposes. If you prefer not to appear, please let an organiser know when you arrive.\n━━━━━━━━━━\nLounge Asia is already growing in Australia and is now expanding across Asia — Japan, Korea, Thailand, Vietnam, Malaysia, Indonesia and Singapore.\nOur goal is simple: More friendship, more understanding, and more genuine connections across cultures.\n📱 Instagram: @_lounge_asia\n🎥 Watch Event Video:\n[https://www.youtube.com/watch?v=tNak_cu9CXw](https://www.youtube.com/watch?v=tNak_cu9CXw)\n👉 GET VIP ACCESS:\n[https://forms.gle/t6GXAjTNFECetVuZ8](https://forms.gle/t6GXAjTNFECetVuZ8)\n━━━━━━━━━━\n🌏 **Come say hi!**\nHey, come hang out! 来一起玩吧！ 一起來聊天吧！ 気軽に遊びに来てね！ 편하게 놀러 와요! มาเจอกันนะ! Tới chơi nha! Tara, sali ka na! Yuk, gabung! လာပြီး အတူပျော်ကြရအောင်! មកលេងជាមួយគ្នាណា! ມາພົບກັນເດີ້! Хамтдаа цуглацгаая! Komm einfach vorbei! Jom join kita!\nSee you at Lounge Asia!","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/loungeasiaamericas/events/317216116/","isSaved":false,"maxTickets":100,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536663965"},"displayPhoto":{"__ref":"PhotoInfo:536663965"},"feeSettings":null,"socialProofInsights":null,"rsvps .org/visit/getting-here/parking.\n\nAlternatively, the MBTA green E line has a stop right out front called Museum of Fine Arts.","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/everramatchmakingbest/events/316841168/","isAttending":false,"isSaved":false,"maxTickets":0,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:530008787"},"displayPhoto":{"__ref":"PhotoInfo:530008787"},"feeSettings":null,"group":{"__ref":"Group:31602687"},"socialProofInsights":null,"rsvps":{"__typename":"RsvpConnection","totalCount":60,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:186275488"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:220439869"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:64985192"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:183958525"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:235927629"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:7689804"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:328883396"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:405098182"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:346300859"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:474925904"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:399812504"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:482209619"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:476810445"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp"
